controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    single_ackermann_controller:
      type: athena_drive_controllers/SingleAckermannController


single_ackermann_controller:
  ros__parameters:
    drive_joints:
      - "propulsion_fl_joint"
      - "propulsion_fr_joint"
      - "propulsion_bl_joint"
      - "propulsion_br_joint"
    steer_joints:
      - "steer_fl_joint"
      - "steer_fr_joint"
    wheelbase: 0.8382
    track_width: 0.6604
    wheel_radius: 0.254
    # Odometry
    open_loop: false
    enable_odom_tf: false
    odom_frame_id: "odom"
    base_frame_id: "base_footprint"
    velocity_rolling_window_size: 10
    invert_drive_fl: false
    invert_drive_fr: false
    invert_drive_rl: false
    invert_drive_rr: false
