# nav_params.yaml — single parameter file passed to all navigation nodes.
# See PLAN.md §7 for full documentation.

# ── Global ──────────────────────────────────────────────────────────────────
use_sim_time: false

# ── gps_pose_publisher ───────────────────────────────────────────────────────
gps_pose_publisher:
  ros__parameters:
    use_sim_time: false
    heading_topic: "/gps/heading"
    origin_lat: .nan              # auto-set from first fix when NaN
    origin_lon: .nan
    origin_alt: 0.0
    use_start_gate_ref: true      # wait for /start_gate_ref NavSatFix to set origin

# ── mission_executive ────────────────────────────────────────────────────────
mission_executive:
  ros__parameters:
    use_sim_time: false
    velocity_zero_threshold: 0.05   # m/s — applied to /odom twist (ZED SDK)
    arrival_hold_time: 1.0          # seconds of continuous zero velocity
    replan_distance_m: 3.0          # cross-track error threshold to trigger replan
    latlon_to_enu_service: "/gps_pose_publisher/latlon_to_enu"

# ── global_planner (athena_smac_planner) ─────────────────────────────────────
global_planner:
  ros__parameters:
    use_sim_time: false
    geotiff_path: ""
    grid_size_m: 500.0
    grid_resolution_m: 1.0
    obstacle_threshold: 50
    min_turning_r: 1.2              # must match mppi_runner
    allow_reverse: false

global_costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    robot_radius: 0.45
    update_frequency: 1.0
    publish_frequency: 0.5
    transform_tolerance: 1.0        # generous — GPS-only localization has jitter
    rolling_window: false
    plugins: ["static_layer", "inflation_layer"]
    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"
      map_topic: /map
      subscribe_to_updates: true
      map_subscribe_transient_local: true
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      cost_scaling_factor: 3.0
      inflation_radius: 1.0         # >= robot_radius (0.45 m)

# ── mppi_runner (ackermann_mppi) ─────────────────────────────────────────────
mppi_runner:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    motion_model: "Ackermann"
    min_turning_r: 1.2
    vx_max: 3.0
    vx_min: 0.0
    wz_max: 1.0
    time_steps: 56
    batch_size: 1000
    model_dt: 0.05
    critics:
      - ConstraintCritic
      - GoalCritic
      - GoalAngleCritic
      - PathFollowCritic
      - PathAlignCritic
      - PreferForwardCritic
    # Local costmap — owned by mppi_runner as a child Costmap2DROS node
    local_costmap:
      ros__parameters:
        use_sim_time: false
        global_frame: map
        robot_base_frame: base_link
        robot_radius: 0.45
        update_frequency: 5.0
        publish_frequency: 2.0
        transform_tolerance: 1.0
        rolling_window: true
        width: 20
        height: 20
        resolution: 0.1
        plugins: []               # Phase 2a: add ObstacleLayer + InflationLayer
