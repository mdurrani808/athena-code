# nav_params.yaml — single parameter file passed to all navigation nodes.
# See PLAN.md §7 for full documentation.

# ── gps_pose_publisher ───────────────────────────────────────────────────────
gps_pose_publisher:
  ros__parameters:
    use_sim_time: true
    heading_topic: "/gps/heading"
    origin_alt: 0.0
    use_start_gate_ref: false      # wait for /start_gate_ref NavSatFix to set origin

# ── mission_executive ────────────────────────────────────────────────────────
mission_executive:
  ros__parameters:
    use_sim_time: true
    velocity_zero_threshold: 0.05   # m/s — applied to /odom twist (ZED SDK)
    arrival_hold_time: 1.0          # seconds of continuous zero velocity
    replan_distance_m: 3.0          # cross-track error threshold to trigger replan
    latlon_to_enu_service: "/gps_pose_publisher/latlon_to_enu"

# ── global_planner (athena_smac_planner) ─────────────────────────────────────
global_planner:
  ros__parameters:
    use_sim_time: true
    # SmacPlannerHybrid params (read under "SmacPlannerHybrid.*" prefix by the planner)
    SmacPlannerHybrid:
      minimum_turning_radius: 1.2   # must match mppi_runner
      angle_quantization_bins: 36
      allow_unknown: true
      max_iterations: 10000000
      max_on_approach_iterations: 10000
      smooth_path: false            # skip smoother for now

# ── global_costmap (owned by global_planner) ─────────────────────────────────
# Costmap2DROS creates the node at /global_costmap/global_costmap (nav2 double-naming)
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.45
      update_frequency: 1.0
      publish_frequency: 0.5
      transform_tolerance: 1.0        # generous — GPS-only localization has jitter
      rolling_window: false
      width: 1000
      height: 1000
      resolution: 1.0
      origin_x: -500.0
      origin_y: -500.0
      # plugins set programmatically in global_planner_node.cpp (empty [] crashes rcl_yaml_param_parser)

# ── local_costmap (owned by mppi_runner) ─────────────────────────────────────
# Costmap2DROS creates the node at /local_costmap/local_costmap (nav2 double-naming)
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.45
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 1.0
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.1
      # plugins omitted — set to [] programmatically in AckermannMPPINode before configure()

# ── mppi_runner (ackermann_mppi) ─────────────────────────────────────────────
mppi_runner:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    mppi:
      model_dt: 0.05
      time_steps: 56
      batch_size: 1000
      vx_max: 3.0
      vx_min: 0.0
      wz_max: 1.0
      AckermannConstraints:
        min_turning_r: 1.2
