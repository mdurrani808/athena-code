# multi_target.yaml — chained mission mirroring the operator flow.
#
# Leg 1 (GNSS): register a metre-frame target via set-target, then drive to it
#               with nav-by-id (exercises the target-registry path). Datum-free.
# Leg 2 (ArUco): spawn a post and navigate to it via nav post1 (GPS).
#
# Post at ENU (18, 6); GPS goal ENU (11, 4) ~7.3 m from the post, computed from
# the terrain_world datum (lat0=38.42391162772634, lon0=-110.78490558433397):
#     ENU (11, 4) -> lat=38.4239476  lon=-110.7847795
#
# Steps without an `assert` block are non-scored setup calls (set-target here).
name: multi_target
world: terrain_world.sdf
world_name: default
timeout_s: 240

setup:
  - spawn: {type: aruco_post, name: post2, pose: [18, 6, 0, 0, 0, 0]}

steps:
  # Leg 1 — register + navigate to a GNSS waypoint at ENU (8, -4).
  - cli: set-target meter wp_a 8 -4 0 3
  - cli: nav-by-id wp_a
    assert:
      kind: gnss
      expect_state: STOPPED_AT_TARGET
      max_dist_m: 3.0

  # Leg 2 — navigate to the ArUco post.
  - cli: nav post1 38.4239476 -110.7847795 13
    assert:
      kind: aruco_post
      target: post2
      expect_state: STOPPED_AT_TARGET
      max_dist_m: 2.0
