# single_aruco_post.yaml — spawn one ArUco post and navigate to it.
#
# The post (id=4, baked into model://aruco_post) is dropped at ENU (12, 3). The
# nav goal is a GPS point ~6 m from the post (within post1's 5-10 m vicinity),
# computed from the terrain_world datum:
#     datum  lat0=38.42391162772634  lon0=-110.78490558433397  (ENU origin)
#     goal   ENU (6, 1.5)  ->  lat=38.4239251  lon=-110.7848368
# After GPS arrival the executive runs the ArUco approach branch; scoring checks
# terminal state + flashing-green LED + ground-truth proximity to the post.
#
# NB (first dry run): the ENU<->GPS mapping assumes the sim's first GPS fix
# equals the world spherical_coordinates datum. If the rover stops short, adjust
# the goal lat/lon or widen max_dist_m — see PROGRESS.md "Open items".
name: single_aruco_post
world: terrain_world.sdf
world_name: default
timeout_s: 240

setup:
  - spawn: {type: aruco_post, name: post1, pose: [12, 3, 0, 0, 0, 0]}

steps:
  - cli: nav post1 38.4239251 -110.7848368 13
    assert:
      kind: aruco_post
      target: post1
      expect_state: STOPPED_AT_TARGET
      max_dist_m: 2.0
