# Minimal Nav2 Configuration for Athena Rover (Ackermann Steering)
# Tuned for: wheelbase=0.8382m, track=0.6604m, wheel_radius=0.254m
# Uses fused localization from /localization/odom (IMU + GPS + wheel odometry)
# NO MAP REQUIRED - uses rolling costmaps for GPS-based outdoor navigation

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /localization/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # Use simple navigate_w_replanning behavior tree (compatible with Humble)
    default_bt_xml_filename: "$(find-pkg-share nav2_bt_navigator)/behavior_trees/navigate_w_replanning_and_recovery.xml"
    plugin_lib_names:
          - nav2_compute_path_to_pose_action_bt_node
          - nav2_compute_path_through_poses_action_bt_node
          - nav2_smooth_path_action_bt_node
          - nav2_follow_path_action_bt_node
          - nav2_spin_action_bt_node
          - nav2_wait_action_bt_node
          - nav2_assisted_teleop_action_bt_node
          - nav2_back_up_action_bt_node
          - nav2_drive_on_heading_bt_node
          - nav2_clear_costmap_service_bt_node
          - nav2_reinitialize_global_localization_service_bt_node
          - nav2_truncate_path_action_bt_node
          - nav2_goal_updater_node_bt_node
          - nav2_remove_passed_goals_action_bt_node
          - nav2_navigate_to_pose_action_bt_node
          - nav2_navigate_through_poses_action_bt_node
          - nav2_planner_selector_bt_node
          - nav2_controller_selector_bt_node
          - nav2_goal_checker_selector_bt_node
          - nav2_is_stuck_condition_bt_node
          - nav2_goal_reached_condition_bt_node
          - nav2_goal_updated_condition_bt_node
          - nav2_initial_pose_received_condition_bt_node
          - nav2_transform_available_condition_bt_node
          - nav2_time_expired_condition_bt_node
          - nav2_distance_traveled_condition_bt_node
          - nav2_rate_controller_bt_node
          - nav2_distance_controller_bt_node
          - nav2_speed_controller_bt_node
          - nav2_recovery_node_bt_node
          - nav2_pipeline_sequence_bt_node
          - nav2_round_robin_node_bt_node

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /localization/odom
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    current_goal_checker: "general_goal_checker"
    controller_plugins: ["FollowPath"]
    speed_limit_topic: "speed_limit"

    # Progress checker
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    # Goal checker - relaxed for outdoor navigation
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 1.0          # 1m tolerance for outdoor waypoints
      yaw_goal_tolerance: 0.5         # ~30 degrees

    # Regulated Pure Pursuit Controller - tuned for Ackermann
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 1.0         # Target speed (m/s)
      lookahead_dist: 2.5             # Base lookahead distance
      min_lookahead_dist: 1.5         # Minimum lookahead
      max_lookahead_dist: 4.0         # Maximum lookahead
      lookahead_time: 1.5             # Time-based lookahead (seconds)
      rotate_to_heading_angular_vel: 0.5
      transform_tolerance: 0.5
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.2
      approach_velocity_scaling_dist: 1.0
      use_collision_detection: false  # No obstacle avoidance
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false  # No costmap-based scaling
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: true
      allow_reversing: false          # Ackermann forward-only
      rotate_to_heading_min_angle: 0.785  # 45 degrees
      max_linear_accel: 1.0           # m/s^2
      max_linear_decel: 1.0           # m/s^2
      max_angular_accel: 2.0          # rad/s^2
      max_robot_pose_search_dist: 10.0
      use_interpolation: false

behavior_server:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.1
    rotational_acc_lim: 1.0

    # Recovery behaviors required by nav2 behavior trees
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]

    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    wait:
      plugin: "nav2_behaviors/Wait"

# Global costmap - ROLLING WINDOW (no static map needed)
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      robot_base_frame: base_link
      global_frame: map
      update_frequency: 1.0
      publish_frequency: 1.0
      resolution: 0.5                   # 50cm resolution
      width: 100                        # 50m x 50m rolling area
      height: 100
      rolling_window: true              # ROLLING - no static map needed
      track_unknown_space: false
      always_send_full_costmap: true

      # Robot footprint - based on Athena rover dimensions
      # Approximate: length=0.7m, width=0.52m (track=0.66m with margin)
      footprint: "[[0.35, 0.26], [0.35, -0.26], [-0.35, -0.26], [-0.35, 0.26]]"

      # MINIMAL PLUGINS - no static layer (no map needed)
      plugins: ["inflation_layer"]
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.0

# Local costmap - ROLLING WINDOW (no static map needed)
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true              # Always rolling for local costmap
      width: 10                         # 10m x 10m local area
      height: 10
      resolution: 0.25                  # 25cm resolution
      always_send_full_costmap: true

      # Same footprint as global
      footprint: "[[0.35, 0.26], [0.35, -0.26], [-0.35, -0.26], [-0.35, 0.26]]"

      # MINIMAL PLUGINS - no static layer (no map needed)
      plugins: ["inflation_layer"]
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.8

# Lifecycle manager - manages nav2 nodes
lifecycle_manager:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator