  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /localization/odom
    bt_loop_duration: 100
    default_server_timeout: 20
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - bt_nodes

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.5
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_planning_time: 2.0

      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 1.5
      reverse_penalty: 2.5
      change_penalty: 0.5
      non_straight_penalty: 1.4
      cost_penalty: 15.0
      retrospective_penalty: 0.1

      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      smooth_path: true

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001  # Fixed: was 0.5, too high for non-holonomic robot
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /localization/odom
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 0.3

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # Rollout / sampling
      time_steps: 56               # Number of steps per trajectory (56 * 0.05s = 2.8s horizon)
      model_dt: 0.05               # Time delta between steps — matches controller_frequency (20 Hz)
      batch_size: 2000             # Number of sampled trajectories per iteration
      iteration_count: 1           # MPPI optimization iterations per control cycle
      temperature: 0.3             # Lower = more exploitation of best trajectory

      # Velocity limits — match your robot
      vx_max: 0.1524               # Same as old desired_linear_vel
      vx_min: -0.1524              # Allow reversing
      vy_max: 0.0                  # Non-holonomic: no lateral velocity
      wz_max: 0.3                  # Match behavior_server max_rotational_vel

      # Acceleration limits
      ax_max: 1.0
      ax_min: -1.5                 # Match old max_linear_decel
      ay_max: 0.0
      az_max: 1.2                  # Match old max_angular_accel

      # Noise standard deviations for trajectory sampling
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4

      # Lookahead for path tracking
      lookahead_dist: 2.5

      # Path following
      enforce_path_inversion: false

      # Critics — MPPI scores trajectories using these weighted cost functions
      critics:
        [
          "ConstraintCritic",
          "ObstaclesCritic",
          "GoalCritic",
          "GoalAngleCritic",
          "PathAlignCritic",
          "PathFollowCritic",
          "PathAngleCritic",
          "PreferForwardCritic"
        ]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5
        critical_weight: 20.0     # Heavy penalty for trajectories entering obstacles
        consider_footprint: true  # Use full robot footprint, not point
        collision_cost: 10000.0
        collision_margin_distance: 0.15
        near_goal_distance: 0.5
        inflation_radius: 1.2     # Must match local costmap inflation_radius

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.0

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.4

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.4
        offset_from_furthest: 20
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.4
        max_angle_to_furthest: 1.0
        forward_preference: true

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0         # Penalize reversing unless necessary
        threshold_to_consider: 0.4

behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.3
    min_rotational_vel: 0.05
    rotational_acc_lim: 0.8

    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    wait:
      plugin: "nav2_behaviors/Wait"

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      robot_base_frame: base_footprint
      global_frame: map
      update_frequency: 5.0
      publish_frequency: 2.0
      resolution: 0.1
      width: 100
      height: 100
      rolling_window: true
      track_unknown_space: false
      always_send_full_costmap: true
      footprint: "[[0.45, 0.33], [0.45, -0.33], [-0.35, -0.33], [-0.35, 0.33]]"
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        observation_sources: obstacles
        obstacles:
          data_type: "PointCloud2"
          topic: "/zed/zed_node/point_cloud/cloud_registered_corrected"
          marking: true
          clearing: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 10.0
          raytrace_max_range: 12.0
          obstacle_min_range: 0.0
          observation_persistence: 3.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 2.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 10.0
      publish_frequency: 5.0
      rolling_window: true
      width: 12
      height: 12
      resolution: 0.05
      transform_tolerance: 1.0
      footprint: "[[0.45, 0.33], [0.45, -0.33], [-0.35, -0.33], [-0.35, 0.33]]"
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        footprint_clearing_enabled: true
        min_obstacle_height: 0.0
        max_obstacle_height: 10.0
        z_voxels: 10
        origin_z: -0.1
        z_resolution: 0.2
        unknown_threshold: 15
        mark_threshold: 1         # Fixed: was 0, require 2 filled voxels to mark occupied (reduces noise)
        combination_method: 1
        publish_voxel_map: false
        observation_sources: obstacles
        obstacles:
          data_type: "PointCloud2"
          topic: "/zed/zed_node/point_cloud/cloud_registered_corrected"
          marking: true
          clearing: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 5.0
          raytrace_max_range: 7.0
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.5   # Fixed: was 5.0, relaxed to be less aggressive
        inflation_radius: 1.5      # Fixed: was 1.2, increased for better obstacle margin

lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator