state_estimator:
  ros__parameters:
    # ==========================================================================
    # Topic Configuration
    # ==========================================================================
    imu_topic: "/imu"
    gnss_topic: "/gps/fix"
    odom_topic: "/odom/ground_truth"
    output_odom_topic: "/localization/odom"

    # ==========================================================================
    # Frame Names
    # ==========================================================================
    tf_prefix: ""
    map_frame: "map"
    odom_frame: "odom"
    base_frame: "base_link"
    imu_frame: "imu_link"
    gnss_frame: "gnss_link"

    # ==========================================================================
    # Publish Rates
    # ==========================================================================
    publish_rate: 50.0          # Hz - state odometry publish rate
    tf_publish_rate: 20.0       # Hz - map->odom transform publish rate

    # ==========================================================================
    # IMU Noise Parameters (continuous-time spectral densities)
    # ==========================================================================
    accel_noise_sigma: 0.2          # m/s^2/sqrt(Hz) - accelerometer noise
    gyro_noise_sigma: 0.01          # rad/s/sqrt(Hz) - gyroscope noise
    accel_bias_rw_sigma: 0.001      # m/s^3/sqrt(Hz) - accelerometer bias random walk
    gyro_bias_rw_sigma: 0.0001      # rad/s^2/sqrt(Hz) - gyroscope bias random walk

    # ==========================================================================
    # GNSS Parameters
    # ==========================================================================
    gnss_position_sigma: 0.25       # meters - minimum position uncertainty
    gnss_max_age: 1.0               # seconds - reject measurements older than this
    gnss_fix_quality_multiplier: 1.5  # inflate noise for single-point fix

    # GNSS outlier rejection (Huber robust noise model)
    use_robust_gnss_noise: true
    gnss_huber_k: 1.345             # Huber loss parameter (1.345 = 95% efficiency)

    # ==========================================================================
    # Odometry Parameters
    # ==========================================================================
    odom_position_sigma: 0.1        # meters - odometry position uncertainty
    odom_rotation_sigma: 0.05       # radians - odometry rotation uncertainty

    # ==========================================================================
    # Graph Management
    # ==========================================================================
    state_creation_rate: 20.0       # Hz - rate of new state creation
    max_graph_states: 100           # max states before marginalization

    # ISAM2 optimizer parameters
    isam2_relinearize_threshold: 0.1
    isam2_relinearize_skip: 1

    # ==========================================================================
    # IMU Integration Parameters
    # ==========================================================================
    integration_covariance: 1.0e-8  # numerical integration error covariance
    bias_acc_omega_int: 1.0e-5      # bias integration covariance

    # ==========================================================================
    # Initialization Parameters
    # ==========================================================================
    min_imu_samples_for_init: 50    # samples needed before initialization (~0.5s at 100Hz)
    initial_velocity_sigma: 0.5     # m/s - assume starting roughly stationary
    initial_rotation_sigma: 0.1     # rad - initial rotation uncertainty
    initial_accel_bias_sigma: 0.05  # m/s^2 - initial accelerometer bias uncertainty
    initial_gyro_bias_sigma: 0.005  # rad/s - initial gyroscope bias uncertainty

    # ==========================================================================
    # Buffer Configuration
    # ==========================================================================
    imu_buffer_max_size: 1000       # max IMU samples to buffer (~5s at 200Hz)

    # ==========================================================================
    # ENU Origin (optional - if not set, uses first GNSS fix)
    # ==========================================================================
    origin_lat: 38.42391162772634
    origin_lon: -110.78490558433397
    origin_alt: 0.0
