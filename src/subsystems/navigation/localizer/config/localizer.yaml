state_estimator:
  ros__parameters:
    # ==========================================================================
    # Topic Configuration
    # ==========================================================================
    imu_topic: "/imu"
    gnss_topic: "/gps/fix"
    odom_topic: ""
    output_odom_topic: "/localization/odom"

    # ==========================================================================
    # Frame Names
    # ==========================================================================
    tf_prefix: ""
    map_frame: "map"
    odom_frame: "odom"
    base_frame: "base_link"
    imu_frame: "imu_link"
    gnss_frame: "gnss_link"

    # ==========================================================================
    # Publish Rates
    # ==========================================================================
    publish_rate: 100.0          # Hz - higher rate for smooth simulation
    tf_publish_rate: 50.0        # Hz - higher tf rate for better visualization

    # ==========================================================================
    # IMU Noise Parameters (continuous-time spectral densities)
    # ==========================================================================
    accel_noise_sigma: 0.01         # m/s^2/sqrt(Hz) - much lower for ideal sim
    gyro_noise_sigma: 0.001         # rad/s/sqrt(Hz) - much lower for ideal sim
    accel_bias_rw_sigma: 1.0e-5     # m/s^3/sqrt(Hz) - minimal bias drift
    gyro_bias_rw_sigma: 1.0e-6      # rad/s^2/sqrt(Hz) - minimal bias drift

    # ==========================================================================
    # GNSS Parameters
    # ==========================================================================
    gnss_position_sigma: 0.05       # meters - better accuracy in simulation
    gnss_max_age: 0.5               # seconds - tighter timing for sim
    gnss_fix_quality_multiplier: 1.0  # no degradation in ideal conditions

    # GNSS outlier rejection (Huber robust noise model)
    use_robust_gnss_noise: false    # no outliers in ideal sim
    gnss_huber_k: 1.345

    # ==========================================================================
    # Odometry Parameters
    # ==========================================================================
    odom_position_sigma: 0.01       # meters - very accurate wheel odometry
    odom_rotation_sigma: 0.005      # radians - very accurate rotation

    # ==========================================================================
    # Graph Management
    # ==========================================================================
    state_creation_rate: 50.0       # Hz - higher rate for better trajectory
    max_graph_states: 200           # more states for longer optimization window

    # ISAM2 optimizer parameters
    isam2_relinearize_threshold: 0.01  # tighter convergence
    isam2_relinearize_skip: 5          # relinearize more often

    # ==========================================================================
    # IMU Integration Parameters
    # ==========================================================================
    integration_covariance: 1.0e-10 # very low numerical error in simulation
    bias_acc_omega_int: 1.0e-8      # minimal bias integration error

    # ==========================================================================
    # Initialization Parameters
    # ==========================================================================
    min_imu_samples_for_init: 20    # faster init in simulation (~0.2s at 100Hz)
    initial_velocity_sigma: 0.1     # m/s - tighter initial velocity estimate
    initial_rotation_sigma: 0.01    # rad - more confident initial orientation
    initial_accel_bias_sigma: 0.001 # m/s^2 - minimal initial bias
    initial_gyro_bias_sigma: 0.0001 # rad/s - minimal initial bias

    # ==========================================================================
    # Buffer Configuration
    # ==========================================================================
    imu_buffer_max_size: 2000       # larger buffer for high-rate data

    # ==========================================================================
    # ENU Origin (optional - if not set, uses first GNSS fix)
    # ==========================================================================
    origin_lat: 38.42391162772634
    origin_lon: -110.78490558433397
    origin_alt: 0.0